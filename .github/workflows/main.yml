name: Trading Signal Alerts
run-name: Consulta XRP/USDT ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Identificador de la consulta cifrada"
        type: string
        required: true

jobs:
  check-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    concurrency:
      group: trading-signal-alerts
      cancel-in-progress: false
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Comprobar reglas de cuenta y cifrado
        run: python -m unittest test_quantfury_account.py test_alert_bot.py test_run_now.py test_result_codec.py
      - name: Consultar y cifrar resultado
        env:
          QUANTFURY_CLIENT_ID: ${{ secrets.QUANTFURY_CLIENT_ID }}
          QUANTFURY_REFRESH_TOKEN: ${{ secrets.QUANTFURY_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          APP_RESULT_PASSWORD: ${{ secrets.APP_RESULT_PASSWORD }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python alert_bot.py
      - name: Guardar resultado cifrado un día
        uses: actions/upload-artifact@v4
        with:
          name: signal-${{ inputs.request_id }}
          path: result.json.enc
          retention-days: 1
          if-no-files-found: error
