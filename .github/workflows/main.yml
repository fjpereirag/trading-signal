name: Trading Signal Alerts

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Enviar un único mensaje de prueba al chat configurado"
        type: boolean
        required: false
        default: false
      report_telegram:
        description: "Enviar un único resumen de mercado externo V4"
        type: boolean
        required: false
        default: false

jobs:
  check-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar señal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
          REPORT_TELEGRAM: ${{ inputs.report_telegram }}
          REPORT_SCHEDULE: ${{ github.event.schedule == '17,47 * * * *' }}
        run: python alert_bot.py
